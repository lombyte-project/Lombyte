<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Lombyte Naming Desk: know the game? Help name its code.">
<style>
  .ui{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:13px}
  .old{animation:out 6s infinite}
  .new{opacity:0;animation:in 6s infinite}
  @keyframes out{0%,35%{opacity:1}45%,92%{opacity:0}100%{opacity:1}}
  @keyframes in{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.old{animation:none;opacity:0}.new{animation:none;opacity:1}}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2a1c10"/>
    <stop offset=".55" stop-color="#0d1117"/>
  </linearGradient>
</defs>
<rect width="880" height="300" rx="10" fill="url(#bg)"/>

<!-- left: the pitch -->
<text class="ui" x="32" y="48" font-size="11" font-weight="700" letter-spacing="1.2" fill="#de812f">NO CODING NEEDED</text>
<text class="ui" x="32" y="84" font-size="26" font-weight="600" fill="#f0f6fc">Know the game?</text>
<text class="ui" x="32" y="116" font-size="26" font-weight="600" fill="#f0f6fc">Help name its code.</text>
<g class="ui" font-size="14" fill="#c3cbd8">
  <circle cx="43" cy="153" r="11" fill="#de812f" fill-opacity=".18"/><text x="43" y="157" font-size="11" font-weight="700" fill="#de812f" text-anchor="middle">1</text><text x="62" y="158">Pick a name</text>
  <circle cx="203" cy="153" r="11" fill="#de812f" fill-opacity=".18"/><text x="203" y="157" font-size="11" font-weight="700" fill="#de812f" text-anchor="middle">2</text><text x="222" y="158">Test in PCSX2</text>
  <circle cx="43" cy="185" r="11" fill="#de812f" fill-opacity=".18"/><text x="43" y="189" font-size="11" font-weight="700" fill="#de812f" text-anchor="middle">3</text><text x="62" y="190">Rename it</text>
  <circle cx="203" cy="185" r="11" fill="#de812f" fill-opacity=".18"/><text x="203" y="189" font-size="11" font-weight="700" fill="#de812f" text-anchor="middle">4</text><text x="222" y="190">Send an issue</text>
</g>
<rect x="32" y="222" width="226" height="44" rx="8" fill="#de812f"/>
<text class="ui" x="145" y="249" font-size="15" font-weight="700" fill="#000" text-anchor="middle">Open the Naming Desk →</text>

<!-- right: a placeholder turning into a real name -->
<g transform="translate(420 40)">
  <rect x=".5" y=".5" width="427" height="219" rx="9" fill="#050608" stroke="#21262d"/>
  <circle cx="18" cy="17" r="4.5" fill="#30363d"/><circle cx="32" cy="17" r="4.5" fill="#30363d"/><circle cx="46" cy="17" r="4.5" fill="#30363d"/>
  <text class="mono" x="64" y="21" font-size="11.5" fill="#8b949e">ui/hud/002661a0.c</text>
  <line x1="1" y1="34" x2="427" y2="34" stroke="#21262d"/>
  <g class="mono" fill="#e8edf5">
    <text x="18" y="62"><tspan fill="#e39a58">void</tspan> <tspan fill="#8ec3e3">init_hud_elem</tspan>(HudElem *e) {</text>
    <text x="18" y="86" xml:space="preserve">    e-&gt;</text>
    <g class="old"><rect x="80" y="72" width="86" height="19" rx="3" fill="#de812f" fill-opacity=".18"/><text x="123" y="86" text-anchor="middle" fill="#8b949e">unk7C</text></g>
    <g class="new"><rect x="80" y="72" width="86" height="19" rx="3" fill="#de812f"/><text x="123" y="86" text-anchor="middle" fill="#000" font-weight="600">fade_timer</text></g>
    <text x="172" y="86">= scale_game_frames(<tspan fill="#c9a6e8">0xB4</tspan>);</text>
    <text x="18" y="110" xml:space="preserve">    e-&gt;w = <tspan fill="#c9a6e8">0x80</tspan>;</text>
    <text x="18" y="134" xml:space="preserve">    e-&gt;h = <tspan fill="#c9a6e8">0x80</tspan>;</text>
    <text x="18" y="158">}</text>
  </g>
  <line x1="1" y1="176" x2="427" y2="176" stroke="#21262d"/>
  <circle cx="20" cy="198" r="4" fill="#6cc495"/>
  <text class="ui" x="32" y="202" font-size="12.5" fill="#8b949e">Player's idea: <tspan fill="#c3cbd8">counts down before the icon fades</tspan></text>
</g>
</svg>
